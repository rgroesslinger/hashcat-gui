name: CI Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        compiler: [linux-gcc, linux-clang, windows-gcc, windows-clang]
        include:
          - compiler: linux-gcc
            runs-on: ubuntu-latest
            cxx: g++
          - compiler: linux-clang
            runs-on: ubuntu-latest
            cxx: clang++
          - compiler: windows-gcc
            runs-on: windows-latest
            cxx: g++
          - compiler: windows-clang
            runs-on: windows-latest
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----- Linux -----
      # qt6-tools-dev + qt6-l10n-tools are what Qt6LinguistTools needs: the
      # CMake package and the lupdate/lrelease binaries. Without them the
      # build still succeeds, it just produces no .qm - which would silently
      # defeat the translation check below.
      # qt6-qpa-plugins supplies the offscreen platform plugin the tests run
      # with; qt6-base-dev alone does not always pull it in.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential g++ clang cmake \
            qt6-base-dev qt6-qpa-plugins \
            qt6-tools-dev qt6-l10n-tools

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # A source string added without refreshing the catalogs would only be
      # noticed the next time somebody ran lupdate. Refresh them here and
      # insist the result is empty.
      - name: Check the translations are in step with the sources (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target update_translations
          git diff --exit-code -- translations/

      # ----- Windows setup -----
      - name: Set up MSYS2 with UCRT64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
