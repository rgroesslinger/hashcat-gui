name: Publish release binaries

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    # Uploading the asset is the only write to the repository.
    permissions:
      contents: write

    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            zip

      - name: Build
        shell: msys2 {0}
        run: |
          # Same configuration as the OBS packages
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHASHCAT_GUI_REQUIRE_TRANSLATIONS=ON
          cmake --build build

      - name: Copy executable and dependencies
        shell: msys2 {0}
        run: |
          mkdir -p "hashcat-gui-$REF_NAME/docs"
          cp build/hashcat-gui.exe "hashcat-gui-$REF_NAME/"
          cp README.md CHANGELOG.md FAQ.md LICENSE "hashcat-gui-$REF_NAME/docs/"
          # The zip bundles Qt, so include its LGPL text
          cp /ucrt64/share/licenses/qt6-base/LGPL-3.0-only.txt \
            "hashcat-gui-$REF_NAME/docs/LGPL-3"
          cat > "hashcat-gui-$REF_NAME/docs/NOTICE" <<'EOF'
          This package bundles Qt (LGPL-3.0-only). The full license text is
          alongside this file. The application itself is GPL-3.0-or-later
          (see LICENSE).
          EOF
          cd "hashcat-gui-$REF_NAME/"
          windeployqt6.exe hashcat-gui.exe --release --compiler-runtime

      - name: Zip release artifacts
        shell: msys2 {0}
        run: |
          zip -r "hashcat-gui-$REF_NAME-windows-x64.zip" "hashcat-gui-$REF_NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "hashcat-gui-${{ env.REF_NAME }}-windows-x64.zip"
          fail_on_unmatched_files: true

  appimage:
    runs-on: ubuntu-26.04

    # Uploading the asset is the only write to the repository.
    permissions:
      contents: write

    env:
      ARCH: x86_64
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build AppImage
        run: |
          sudo apt update
          sudo apt install -y build-essential g++ cmake squashfs-tools \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-translations-l10n qt6-wayland \
            desktop-file-utils xvfb xauth

          # /usr keeps the binary and desktop file where linuxdeploy looks.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF -DHASHCAT_GUI_REQUIRE_TRANSLATIONS=ON
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

          # linuxdeploy bundles the host's Qt and OpenSSL plus their Debian
          # copyright files. Those files only name the licenses (LGPL-3 and
          # Apache-2.0), they don't contain the texts, so copy the texts here.
          install -Dm644 README.md CHANGELOG.md FAQ.md LICENSE \
            -t AppDir/usr/share/doc/hashcat-gui/
          install -Dm644 /usr/share/common-licenses/LGPL-3 \
            /usr/share/common-licenses/Apache-2.0 -t AppDir/usr/share/doc/hashcat-gui/
          cat > AppDir/usr/share/doc/hashcat-gui/NOTICE <<'EOF'
          This AppImage bundles Qt (LGPL-3.0-only) and OpenSSL (Apache-2.0),
          among others. The full license texts are alongside this file;
          per-library copyright notices are under usr/share/doc/. The
          application itself is GPL-3.0-or-later (see LICENSE).
          EOF

          # Fetch tools from continuous releases.
          mkdir -p tools && ( cd tools
            curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            curl -fsSLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            curl -fsSLO https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
            chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage \
              appimagetool-x86_64.AppImage )

          export PATH="$PWD/tools:$PATH"
          export QMAKE=qmake6
          # Tools are AppImages; extract-and-run where FUSE is unavailable.
          # No --output: deploy only. Qt 6.10 ships one libqwayland.so; the
          # waylandcompositor module adds its graphics/shell/decoration plugins.
          APPIMAGE_EXTRACT_AND_RUN=1 EXTRA_PLATFORM_PLUGINS=libqwayland.so \
            EXTRA_QT_MODULES=waylandcompositor \
            ./tools/linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt

          desktop-file-validate AppDir/hashcat-gui.desktop

          # --runtime-file uses the static runtime; zstd compression is the default.
          # appimagetool derives .DirIcon from this PNG; linuxdeploy only adds the SVG.
          install -Dm644 src/icons/hicolor/256x256/apps/hashcat-gui.png AppDir/hashcat-gui.png
          VERSION="${REF_NAME#v}"
          APPIMAGE_EXTRACT_AND_RUN=1 VERSION="$VERSION" ./tools/appimagetool-x86_64.AppImage \
            --runtime-file ./tools/runtime-x86_64 --no-appstream \
            AppDir "hashcat-gui-$REF_NAME-$ARCH.AppImage"

          # --version builds QApplication first (src/main.cpp); Xvfb exercises xcb.
          # Extract-and-run keeps the check independent of FUSE in the runner.
          APP="./hashcat-gui-$REF_NAME-$ARCH.AppImage"
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$APP" --version)
          [ -n "$out" ] || { echo "--version produced no output" >&2; false; }

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hashcat-gui-${{ env.REF_NAME }}-${{ env.ARCH }}.AppImage
          fail_on_unmatched_files: true
