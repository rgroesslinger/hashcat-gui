name: CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
    strategy:
      matrix:
        compiler: [linux-gcc, linux-clang, windows-gcc, windows-clang]
        include:
          - compiler: linux-gcc
            runs-on: ubuntu-26.04
            cxx: g++
          - compiler: linux-clang
            runs-on: ubuntu-26.04
            cxx: clang++
          - compiler: windows-gcc
            runs-on: windows-latest
            cxx: g++
          - compiler: windows-clang
            runs-on: windows-latest
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----- Linux -----
      # qt6-tools-dev + qt6-l10n-tools provide Qt6LinguistTools: the CMake
      # package and the lupdate/lrelease binaries. Without them the build
      # still works, just with no .qm, and tst_translations skips - it only
      # checks that offered languages have an embedded catalog.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential g++ clang cmake \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools desktop-file-utils

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # Validate desktop file
      - name: Validate the desktop entry (Linux)
        if: matrix.compiler == 'linux-gcc'
        run: desktop-file-validate hashcat-gui.desktop

      # ----- Windows setup -----
      - name: Set up MSYS2 with UCRT64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --no-tests=error
